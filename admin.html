<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Apps Hub — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f2f6fb;
    --warm-brown: #244a6b;
    --accent: #2b7fb8;
    --accent-light: #dbe9f5;
    --text: #202b38;
    --text-muted: #62778d;
    --card-bg: #ffffff;
    --border: #d6e2ee;
    --shadow: 0 2px 16px rgba(20,50,80,0.10);
    --red: #c0392b;
    --red-light: #fbe9e7;
    --green: #1b8a4a;
  }

  body { font-family: 'Nunito', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

  .page { max-width: 560px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

  header { text-align: center; margin-bottom: 2rem; }
  header h1 { font-family: 'Lora', serif; font-size: 1.8rem; font-weight: 600; color: var(--warm-brown); }
  header p { color: var(--text-muted); margin-top: 0.4rem; }
  header a { color: var(--accent); }

  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
    padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.25rem;
  }

  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.3rem; }
  .field input {
    width: 100%; font-size: 0.95rem; padding: 0.7rem 0.85rem;
    border: 1px solid var(--border); border-radius: 10px; background: var(--cream); color: var(--text);
  }

  .btn {
    display: inline-block; padding: 0.7rem 1.3rem; border-radius: 50px; border: none;
    background: var(--accent); color: #fff; font-family: 'Nunito', sans-serif;
    font-size: 0.95rem; font-weight: 700; cursor: pointer;
  }
  .btn:hover { background: #1f6390; }
  .btn:disabled { background: #b9c8d6; cursor: default; }

  .error-msg { background: var(--red-light); color: var(--red); border-radius: 10px;
    padding: 0.6rem 0.85rem; font-size: 0.85rem; margin-top: 0.75rem; }
  .info-msg { background: var(--accent-light); color: var(--warm-brown); border-radius: 10px;
    padding: 0.6rem 0.85rem; font-size: 0.85rem; margin-top: 0.75rem; }
  .success-msg { background: #e4f5eb; color: var(--green); border-radius: 10px;
    padding: 0.6rem 0.85rem; font-size: 0.85rem; margin-top: 0.75rem; }

  .user-found { font-size: 0.95rem; margin-bottom: 1rem; }
  .user-found strong { color: var(--warm-brown); }

  .app-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0;
    border-bottom: 1px solid var(--border); }
  .app-row:last-child { border-bottom: none; }
  .app-row input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; }
  .app-row .emoji { font-size: 1.2rem; }
  .app-row .name { flex: 1; font-weight: 700; }
  .app-row .public-tag { font-size: 0.8rem; color: var(--text-muted); font-weight: 400; }

  .hidden { display: none; }
</style>
</head>
<body>
<div class="page">

  <header>
    <h1>Manage App Access</h1>
    <p>My Apps Hub admin · <a href="/my-apps-hub.html">Back to the Hub</a></p>
  </header>

  <div id="loginCard" class="card hidden">
    <div class="field">
      <label for="liEmail">Email</label>
      <input type="email" id="liEmail" autocomplete="username">
    </div>
    <div class="field">
      <label for="liPw">Password</label>
      <input type="password" id="liPw" autocomplete="current-password">
    </div>
    <button class="btn" id="liBtn">Sign In</button>
    <div id="loginMsg"></div>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <div class="field">
        <label for="lookupEmail">User's email</label>
        <input type="email" id="lookupEmail" placeholder="them@example.com">
      </div>
      <button class="btn" id="lookupBtn">Look Up</button>
      <div id="lookupMsg"></div>
    </div>

    <div id="accessCard" class="card hidden"></div>
  </div>

</div>

<script>
const API_URL = 'https://seniorfamily.org/my-apps-hub-api/api.php';
const AUTH_KEY = 'appsHubAuth'; // shared with index.html on the same domain

let auth = null;
let currentUserId = null;
let currentApps = []; // [{ appId, appKey, name, iconEmoji, isPublic, granted }]

const loginCard = document.getElementById('loginCard');
const appEl = document.getElementById('app');
const accessCard = document.getElementById('accessCard');

function loadAuth() { try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch { return null; } }

async function fetchJSON(action, { method = 'GET', body, params } = {}) {
  const qs = new URLSearchParams({ action, ...(params || {}) });
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (auth) opts.headers['Authorization'] = `Bearer ${auth.token}`;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`${API_URL}?${qs}`, opts);
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── login (only shown if not already logged in via index.html) ──────────
async function attemptLogin() {
  const email = document.getElementById('liEmail').value.trim();
  const password = document.getElementById('liPw').value;
  const msg = document.getElementById('loginMsg');
  if (!email || !password) {
    msg.innerHTML = '<div class="error-msg">Enter your email and password.</div>';
    return;
  }
  try {
    const data = await fetchJSON('login', { method: 'POST', body: { email, password } });
    auth = { token: data.token, displayName: data.displayName || email };
    localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
    showAdminTool();
  } catch (err) {
    msg.innerHTML = `<div class="error-msg">${escHtml(err.message)}</div>`;
  }
}

document.getElementById('liBtn').addEventListener('click', attemptLogin);
document.getElementById('liPw').addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });

function showLogin(message) {
  loginCard.classList.remove('hidden');
  appEl.classList.add('hidden');
  document.getElementById('loginMsg').innerHTML = message ? `<div class="error-msg">${escHtml(message)}</div>` : '';
}

function showAdminTool() {
  loginCard.classList.add('hidden');
  appEl.classList.remove('hidden');
}

// ── user lookup ───────────────────────────────────────────────────────────
document.getElementById('lookupBtn').addEventListener('click', lookupUser);
document.getElementById('lookupEmail').addEventListener('keydown', e => { if (e.key === 'Enter') lookupUser(); });

async function lookupUser() {
  const email = document.getElementById('lookupEmail').value.trim();
  const msg = document.getElementById('lookupMsg');
  accessCard.classList.add('hidden');
  accessCard.innerHTML = '';
  if (!email) {
    msg.innerHTML = '<div class="error-msg">Enter an email address.</div>';
    return;
  }
  msg.innerHTML = '';
  try {
    const data = await fetchJSON('adminLookupUser', { params: { email } });
    if (!data.found) {
      msg.innerHTML = `
        <div class="info-msg">No account exists yet for that email.</div>
        <button class="btn" id="inviteBtn" style="margin-top:0.75rem">Send Invitation</button>
      `;
      document.getElementById('inviteBtn').addEventListener('click', () => renderInviteGrid(email));
      return;
    }
    currentUserId = data.userId;
    msg.innerHTML = `<div class="success-msg">Found: ${escHtml(data.displayName || email)}</div>`;
    await loadAccessGrid();
  } catch (err) {
    if (/not authorized/i.test(err.message)) {
      msg.innerHTML = '<div class="error-msg">Your account isn\'t set up as an admin.</div>';
    } else if (/session|authoriz/i.test(err.message)) {
      showLogin('Your saved login stopped working. Please log in again.');
    } else {
      msg.innerHTML = `<div class="error-msg">${escHtml(err.message)}</div>`;
    }
  }
}

// ── access grid ──────────────────────────────────────────────────────────
async function loadAccessGrid() {
  const data = await fetchJSON('adminGetUserAccess', { params: { userId: currentUserId } });
  currentApps = data.apps;
  renderAccessGrid();
}

function renderAccessGrid() {
  accessCard.classList.remove('hidden');
  accessCard.innerHTML = `
    ${currentApps.map(a => `
      <div class="app-row">
        <input type="checkbox" data-app-id="${a.appId}" ${a.granted ? 'checked' : ''}>
        <span class="emoji">${a.iconEmoji || '📦'}</span>
        <span class="name">${escHtml(a.name)}</span>
        ${a.isPublic ? '<span class="public-tag">(Public — box grants editing)</span>' : ''}
      </div>
    `).join('')}
    <button class="btn" id="saveAccessBtn" style="margin-top:1rem">Save</button>
    <div id="saveMsg"></div>
  `;
  document.getElementById('saveAccessBtn').addEventListener('click', saveAccess);
}

async function saveAccess() {
  const msg = document.getElementById('saveMsg');
  const grants = Array.from(accessCard.querySelectorAll('input[type="checkbox"]')).map(cb => ({
    appId: Number(cb.dataset.appId),
    granted: cb.checked,
  }));
  msg.innerHTML = '';
  try {
    await fetchJSON('adminSaveAccess', { method: 'POST', body: { userId: currentUserId, grants } });
    msg.innerHTML = '<div class="success-msg">Saved.</div>';
    await loadAccessGrid();
  } catch (err) {
    msg.innerHTML = `<div class="error-msg">${escHtml(err.message)}</div>`;
  }
}

// ── invitations (for an email with no account yet) ─────────────────────────
async function renderInviteGrid(email) {
  accessCard.classList.remove('hidden');
  accessCard.innerHTML = `<div class="status-msg" style="text-align:center;color:var(--text-muted)">Loading apps…</div>`;
  let apps;
  try {
    const data = await fetchJSON('adminAppList');
    apps = data.apps;
  } catch (err) {
    accessCard.innerHTML = `<div class="error-msg">${escHtml(err.message)}</div>`;
    return;
  }

  accessCard.innerHTML = `
    <p class="user-found">Inviting <strong>${escHtml(email)}</strong> — pick which apps to grant in
      addition to whatever's already public:</p>
    ${apps.map(a => `
      <div class="app-row">
        <input type="checkbox" data-app-id="${a.appId}">
        <span class="emoji">${a.iconEmoji || '📦'}</span>
        <span class="name">${escHtml(a.name)}</span>
        ${a.isPublic ? '<span class="public-tag">(Public — box grants editing)</span>' : ''}
      </div>
    `).join('')}
    <button class="btn" id="sendInviteBtn" style="margin-top:1rem">Send Invitation</button>
    <div id="inviteMsg"></div>
  `;
  document.getElementById('sendInviteBtn').addEventListener('click', () => sendInvitation(email));
}

async function sendInvitation(email) {
  const msg = document.getElementById('inviteMsg');
  const appIds = Array.from(accessCard.querySelectorAll('input[type="checkbox"]:checked'))
    .map(cb => Number(cb.dataset.appId));
  msg.innerHTML = '';
  try {
    await fetchJSON('adminSendInvitation', { method: 'POST', body: { email, appIds } });
    accessCard.innerHTML = `<div class="success-msg">Invitation sent to ${escHtml(email)}.</div>`;
  } catch (err) {
    msg.innerHTML = `<div class="error-msg">${escHtml(err.message)}</div>`;
  }
}

// ── init ────────────────────────────────────────────────────────────────
auth = loadAuth();
if (auth) {
  showAdminTool();
} else {
  showLogin();
}
</script>
</body>
</html>
